name: drf
description: "Derafsh — Persian-first one-tap VPN client. GPLv3."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/legal/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#150826"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  android: launcher_icon
  ios: true
  remove_alpha_ios: true

flutter_native_splash:
  color: "#150826"
  image: assets/icon/splash_icon.png
  android_12:
    color: "#150826"
    image: assets/icon/splash_icon.png
  fullscreen: true
