name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ libbox
  libbox:
    name: Build libbox AAR (sing-box v1.14.4)
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Setup Java (gomobile needs it)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          $(go env GOPATH)/bin/gomobile init

      - name: Locate Android NDK
        run: |
          NDK_DIR="$(ls -d "$ANDROID_HOME/ndk/"* 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$NDK_DIR" ]; then
            echo "No preinstalled NDK found" >&2
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"

      - name: Checkout sing-box v1.14.4
        run: |
          git clone --depth 1 --branch v1.14.4 https://github.com/SagerNet/sing-box.git
          cd sing-box
          go mod download

      - name: Build libbox AAR
        working-directory: sing-box
        run: |
          $(go env GOPATH)/bin/gomobile bind -v \
            -o ../libbox.aar \
            -target android \
            -androidapi 24 \
            -androidx \
            -ldflags='-s -w -buildid=' \
            -tags 'with_gvisor,with_quic,with_utls' \
            ./experimental/libbox

      - name: Upload libbox artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: libbox.aar
          retention-days: 7

  # ----------------------------------------------------------------- android
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: libbox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: true

      - name: Download libbox AAR
        uses: actions/download-artifact@v4
        with:
          name: libbox-aar
          path: android/app/libs

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Restore release keystore (if provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/derafsh-release.jks
            cat > android/key.properties <<EOF
          storeFile=derafsh-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Release keystore restored."
          else
            echo "KEYSTORE_BASE64 not set — falling back to debug signing."
          fi

      - name: Build APK (release, universal)
        run: flutter build apk --release

      - name: Rename artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp build/app/outputs/flutter-apk/app-release.apk "Derafsh-${VERSION}.apk"
          ls -la Derafsh-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Derafsh-APK
          path: Derafsh-*.apk
          retention-days: 30

  # --------------------------------------------------------------------- ios
  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "${GITHUB_REF_NAME}" ] && VERSION="${GITHUB_REF_NAME}"
          zip -qry "Derafsh-iOS-${VERSION}-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Derafsh-IPA-unsigned
          path: Derafsh-iOS-*.ipa
          retention-days: 30

  # ----------------------------------------------------------------- release
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Derafsh-APK
          path: rel

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: Derafsh-IPA-unsigned
          path: rel

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la rel
          gh release create "$GITHUB_REF_NAME" \
            --title "درفش ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md \
            rel/*
